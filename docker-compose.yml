services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schoolroom
      POSTGRES_USER: schoolroom
      POSTGRES_PASSWORD: schoolroom
    ports:
      - "5432:5432"
    volumes:
      - schoolroom_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolroom -d schoolroom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  schoolroom_postgres:
