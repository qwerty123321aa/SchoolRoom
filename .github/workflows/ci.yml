name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schoolroom
          POSTGRES_USER: schoolroom
          POSTGRES_PASSWORD: schoolroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolroom -d schoolroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://schoolroom:schoolroom@localhost:5432/schoolroom
      CORS_ORIGINS: http://localhost:5173
      DEV_AUTH_ENABLED: "false"
      VITE_API_URL: http://localhost:4100/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
